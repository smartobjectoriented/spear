# Build the Sphinx documentation and publish it to GitHub Pages.
#
# Enable once under Settings → Pages → Build and deployment → Source:
# "GitHub Actions".  Every push to main then republishes
# https://smartobjectoriented.github.io/spear/
name: documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded run is cancelled, but a deployment in flight is allowed to
# finish rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install the documentation toolchain
        run: python -m pip install --upgrade pip -r doc/requirements.txt

      # -W turns warnings into errors. Without it, an extension that
      # cannot reach its native tool only logs a warning and drops the
      # node: the job stays green while the diagrams are missing from
      # the published pages. --keep-going reports every warning of the
      # run instead of stopping at the first one.
      - name: Build the HTML documentation
        run: sphinx-build -W --keep-going -b html doc/source doc/build/html

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/html

  deploy:
    # A pull request builds the documentation but never publishes it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
