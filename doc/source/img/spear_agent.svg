<text x="540.0" y="28.6" font-size="16" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Agent harness — components and their interactions</text>
<text x="540.0" y="46.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">The spine runs down the left. Everything below the application row is provider-neutral: no module there imports rag_chat.</text>
<rect x="40" y="66" width="300" height="74" rx="0" ry="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="190.0" y="86.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">spear-chat  ·  rag_chat.py</text>
<text x="190.0" y="99.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="190.0" y="113.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">terminal · confirmation · corpus</text>
<text x="190.0" y="126.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">registry · slash commands</text>
<rect x="385" y="66" width="300" height="74" rx="0" ry="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="535.0" y="86.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">retrieval</text>
<text x="535.0" y="99.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="535.0" y="113.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ChromaDB  +  bge-m3 embedder</text>
<text x="535.0" y="126.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">one collection per corpus</text>
<rect x="735" y="66" width="305" height="74" rx="0" ry="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="887.5" y="86.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">durable knowledge</text>
<text x="887.5" y="99.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="887.5" y="113.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">memories-*.md  ·  skills/</text>
<text x="887.5" y="126.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">rules.d/  ·  system-prompt.md</text>
<rect x="40" y="172" width="300" height="78" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="190.0" y="194.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">TaskController</text>
<text x="190.0" y="207.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="190.0" y="221.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">bounded synchronous lifecycle</text>
<text x="190.0" y="234.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">for exactly one task</text>
<rect x="385" y="172" width="300" height="78" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="535.0" y="194.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">PlanningService   (deterministic)</text>
<text x="535.0" y="207.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ExplorationService — Explorer</text>
<text x="535.0" y="221.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ReviewService — Reviewer</text>
<text x="535.0" y="234.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">both isolated, read-only, opt-in</text>
<rect x="735" y="172" width="305" height="78" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="887.5" y="194.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">VerificationPolicy</text>
<text x="887.5" y="207.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="887.5" y="221.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">current-generation evidence only</text>
<text x="887.5" y="234.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">+ the project&#x27;s own bench</text>
<rect x="40" y="282" width="300" height="88" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="190.0" y="309.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">AgentRuntime</text>
<text x="190.0" y="322.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="190.0" y="336.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">the round loop: model turn,</text>
<text x="190.0" y="349.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">validation, tool calls, budgets</text>
<rect x="385" y="282" width="300" height="88" rx="0" ry="0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.4"/>
<text x="535.0" y="303.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ModelBackend</text>
<text x="535.0" y="316.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="535.0" y="329.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">llama.cpp / OpenAI-compatible</text>
<text x="535.0" y="342.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">Anthropic</text>
<text x="535.0" y="355.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">reds-ml: Qwen3-Coder-Next Q8_0</text>
<rect x="735" y="282" width="305" height="88" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="887.5" y="309.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ContextEngine + Compaction</text>
<text x="887.5" y="322.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">BudgetManager</text>
<text x="887.5" y="336.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ProgressMonitor · FailurePolicy</text>
<text x="887.5" y="349.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">Cancellation</text>
<rect x="40" y="402" width="300" height="88" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="190.0" y="423.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ToolRouter</text>
<text x="190.0" y="436.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">+ ToolExposurePolicy</text>
<text x="190.0" y="449.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="190.0" y="462.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">schema · role · hooks · envelope</text>
<text x="190.0" y="475.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">7 tools; 2 for a read-only role</text>
<rect x="385" y="402" width="300" height="88" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="535.0" y="423.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">registered handlers</text>
<text x="535.0" y="436.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="535.0" y="449.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">bash  ·  edit_file  ·  write_file</text>
<text x="535.0" y="462.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">append_file  ·  remember</text>
<text x="535.0" y="475.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">search_corpus  ·  search_internet</text>
<rect x="735" y="402" width="305" height="88" rx="0" ry="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="887.5" y="423.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">WorkingState</text>
<text x="887.5" y="436.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="887.5" y="449.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">task truth, event-reduced.</text>
<text x="887.5" y="462.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">Typed grounded events only —</text>
<text x="887.5" y="475.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">never the conversation.</text>
<rect x="40" y="522" width="300" height="88" rx="0" ry="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="190.0" y="543.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">CommandPolicy · Workspace</text>
<text x="190.0" y="556.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ToolPolicy</text>
<text x="190.0" y="569.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="190.0" y="582.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">classify → capabilities →</text>
<text x="190.0" y="595.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">authorize.  Fail-closed.</text>
<rect x="385" y="522" width="300" height="88" rx="0" ry="0" fill="#f8cecc" stroke="#b85450" stroke-width="1.4"/>
<text x="535.0" y="549.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">CommandRunner</text>
<text x="535.0" y="562.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a"></text>
<text x="535.0" y="576.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">Bubblewrap  ·  systemd scope</text>
<text x="535.0" y="589.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">slirp4netns  ·  prlimit</text>
<rect x="735" y="522" width="305" height="88" rx="0" ry="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="887.5" y="549.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">ResultStore — full tool output</text>
<text x="887.5" y="562.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">CheckpointManager — pre-</text>
<text x="887.5" y="576.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">mutation bytes</text>
<text x="887.5" y="589.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">AuditLogger — metadata only</text>
<rect x="40" y="636" width="1000" height="96" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="540.0" y="653.0" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Under STATE_DIR  —  what the session accumulates, mounted at /state in the container</text>
<rect x="60" y="668" width="300" height="52" rx="0" ry="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="210.0" y="690.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">SessionStore</text>
<text x="210.0" y="704.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">append-only, resumable</text>
<rect x="370" y="668" width="300" height="52" rx="0" ry="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="520.0" y="690.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">audit/runtime-trace.jsonl</text>
<text x="520.0" y="704.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">spans; never arguments</text>
<rect x="725" y="668" width="305" height="52" rx="0" ry="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="877.5" y="690.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">trajectories.jsonl</text>
<text x="877.5" y="704.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">pass · fail · unrated</text>
<rect x="40" y="748" width="490" height="132" rx="0" ry="0" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
<text x="48.0" y="764.0" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">Fail-closed, everywhere. A mechanism that cannot be honoured is an error, never a</text>
<text x="48.0" y="777.2" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">downgrade: no sandbox means the command does not run unsandboxed. Since 2026-08-25 the</text>
<text x="48.0" y="790.4" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">same rule holds within a turn — a command that reports the sandbox missing makes every</text>
<text x="48.0" y="803.6" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">later mutation refuse with DENIED rather than edit what nobody can check.</text>
<rect x="550" y="748" width="490" height="132" rx="0" ry="0" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
<text x="558.0" y="764.0" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">Two loops close on evidence rather than on the model&#x27;s claim. Inside the round loop, a</text>
<text x="558.0" y="777.2" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">mutation carrying no current-generation verification earns one re-prompt. Above it, a</text>
<text x="558.0" y="790.4" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">failed project bench earns exactly one bounded repair attempt, then re-verification.</text>
<text x="558.0" y="803.6" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">Whatever is still unverified is prefixed onto the answer, named file by file.</text>
