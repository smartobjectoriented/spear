<text x="46.0" y="718.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#8fb3d9">not ours</text>
<rect x="240" y="696" width="268" height="46" rx="0" ry="0" fill="#132a22" stroke="#34d399" stroke-width="1.4"/>
<text x="374.0" y="716.2" font-size="9" text-anchor="middle" xml:space="preserve" fill="#dcfce7">llama-server (llama.cpp-next)</text>
<text x="374.0" y="728.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#dcfce7">Qwen3-Coder-Next Q8_0 · reds-ml</text>
<rect x="518" y="696" width="268" height="46" rx="0" ry="0" fill="#132a22" stroke="#34d399" stroke-width="1.4"/>
<text x="652.0" y="716.2" font-size="9" text-anchor="middle" xml:space="preserve" fill="#dcfce7">ChromaDB  +  bge-m3</text>
<text x="652.0" y="728.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#dcfce7">one collection per corpus</text>
<rect x="796" y="696" width="268" height="46" rx="0" ry="0" fill="#132a22" stroke="#34d399" stroke-width="1.4"/>
<text x="930.0" y="716.2" font-size="9" text-anchor="middle" xml:space="preserve" fill="#dcfce7">the host</text>
<text x="930.0" y="728.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#dcfce7">bwrap · systemd · slirp4netns</text>
<rect x="24" y="778" width="1052" height="74" rx="0" ry="0" fill="#101a33" stroke="#334166" stroke-width="1.4"/>
<text x="32.0" y="794.0" font-size="10" text-anchor="start" xml:space="preserve" fill="#cfe3ff">Two rules the picture cannot show. Dependency runs one way: no module below the application band imports rag_chat, and tool_runtime imports nothing of the project at all. And every gate is</text>
<text x="32.0" y="807.2" font-size="10" text-anchor="start" xml:space="preserve" fill="#cfe3ff">fail-closed — a mechanism that cannot be honoured is an error, never a quiet downgrade, including within a turn: once a command reports the sandbox missing, every later mutation is refused.</text>
<rect x="24" y="862" width="1052" height="84" rx="0" ry="0" fill="#101a33" stroke="#334166" stroke-width="1.4"/>
<text x="32.0" y="878.0" font-size="10" text-anchor="start" xml:space="preserve" fill="#cfe3ff">Against the hand-made overview in _static: TaskController is one box here, not two; RetryPolicy is named inside FailurePolicy, where it lives; the Explorer and Reviewer boxes carry the same</text>
<text x="32.0" y="891.2" font-size="10" text-anchor="start" xml:space="preserve" fill="#cfe3ff">experimental colour as their repair loop; and the security band is the whole authorization chain rather than two boxes, because nothing reaches CommandRunner without crossing all of it.</text>
</svg>