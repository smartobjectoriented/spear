<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 699" width="1100" height="699" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444444"/></marker></defs>
<rect width="1100" height="699" fill="#ffffff"/>
<text x="540.0" y="28.6" font-size="16" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Resource control  —  one transient systemd user scope per command</text>
<rect x="40" y="55" width="1000" height="60" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="540.0" y="72.0" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">/sys/fs/cgroup/user.slice/user-&lt;uid&gt;.slice/user@&lt;uid&gt;.service/app.slice/</text>
<text x="68.0" y="99.5" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">delegated controllers:  cpu   memory   pids        (io and cpuset are NOT delegated — they need root)</text>
<rect x="60" y="140" width="520" height="260" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="320.0" y="158.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">edgem-tool-&lt;uuid&gt;.scope   (INSIDE)</text>
<rect x="90" y="185" width="460" height="34" rx="0" ry="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="320.0" y="205.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">bwrap</text>
<rect x="90" y="225" width="460" height="34" rx="0" ry="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="320.0" y="245.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">bwrap namespace child</text>
<rect x="90" y="265" width="460" height="34" rx="0" ry="0" fill="#f8cecc" stroke="#b85450" stroke-width="1.4"/>
<text x="320.0" y="285.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">prlimit → COMMAND and every descendant</text>
<text x="320.0" y="340.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">memory.max · memory.swap.max · pids.max · cpu.max</text>
<text x="320.0" y="353.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">cleaned up by --collect; killed as a tree by</text>
<text x="320.0" y="366.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">systemctl --user kill --kill-whom=all --signal=KILL</text>
<rect x="610" y="140" width="430" height="260" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="825.0" y="158.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">OUTSIDE the scope</text>
<rect x="635" y="185" width="380" height="40" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="825.0" y="201.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">Python supervisor</text>
<text x="825.0" y="215.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">(must survive every abuse)</text>
<rect x="635" y="235" width="380" height="40" rx="0" ry="0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.4"/>
<text x="825.0" y="251.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">slirp4netns</text>
<text x="825.0" y="265.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">(never an OOM collateral victim)</text>
<rect x="635" y="285" width="380" height="40" rx="0" ry="0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.4"/>
<text x="825.0" y="301.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">llama-server / spear-llm.service</text>
<text x="825.0" y="315.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">(system.slice)</text>
<text x="825.0" y="359.4" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">A separate scope per command means no</text>
<text x="825.0" y="372.6" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">cross-talk between tool calls.</text>
<rect x="40" y="425" width="1000" height="250" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="540.0" y="443.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Measured behaviour of the candidate contract</text>
<rect x="70" y="465" width="230" height="30" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="185.0" y="483.9" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">property</text>
<rect x="310" y="465" width="180" height="30" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="400.0" y="483.9" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">candidate</text>
<rect x="500" y="465" width="510" height="30" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="755.0" y="483.9" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">observed enforcement</text>
<rect x="70" y="500" width="230" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="185.0" y="518.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">MemoryMax</text>
<rect x="310" y="500" width="180" height="30" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="400.0" y="518.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">2 GiB</text>
<rect x="500" y="500" width="510" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="755.0" y="518.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">runaway killed at exactly the cap</text>
<rect x="70" y="534" width="230" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="185.0" y="552.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">MemorySwapMax</text>
<rect x="310" y="534" width="180" height="30" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="400.0" y="552.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">0</text>
<rect x="500" y="534" width="510" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="755.0" y="552.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">swap delta measured at 0 kB</text>
<rect x="70" y="568" width="230" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="185.0" y="586.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">TasksMax</text>
<rect x="310" y="568" width="180" height="30" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="400.0" y="586.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">256</text>
<rect x="500" y="568" width="510" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="755.0" y="586.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">fork bomb refused with EAGAIN at 256</text>
<rect x="70" y="602" width="230" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="185.0" y="620.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">CPUQuota</text>
<rect x="310" y="602" width="180" height="30" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="400.0" y="620.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">800%</text>
<rect x="500" y="602" width="510" height="30" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="755.0" y="620.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">throttling only — never a kill</text>
<text x="540.0" y="655.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">These values are the active production defaults, carried by CommandRunner.</text>
</svg>