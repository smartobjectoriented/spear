<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 702" width="1100" height="702" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444444"/></marker></defs>
<rect width="1100" height="702" fill="#ffffff"/>
<text x="540.0" y="28.6" font-size="16" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Authoritative evidence, and what may rest on it</text>
<text x="540.0" y="46.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">Two sources, two roles, and one rule: the document is the only source of normative force.</text>
<rect x="390" y="66" width="300" height="46" rx="0" ry="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="540.0" y="92.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">the question asked this turn</text>
<rect x="390" y="138" width="300" height="50" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="540.0" y="159.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">scope</text>
<text x="540.0" y="173.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">NORMATIVE · IMPLEMENTATION · MIXED</text>
<rect x="30" y="214" width="490" height="250" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="275.0" y="232.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Normative authority</text>
<rect x="55" y="254" width="440" height="44" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="275.0" y="279.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">bound standard — one document and revision, per machine</text>
<rect x="55" y="308" width="440" height="52" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="275.0" y="330.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">standard.search · standard.fetch</text>
<text x="275.0" y="344.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">standard.get_structure · standard.cite</text>
<rect x="55" y="370" width="440" height="76" rx="0" ry="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="275.0" y="398.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">provision records</text>
<text x="275.0" y="411.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">identity (Rule / Permission / Observation, ordinal)</text>
<text x="275.0" y="424.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">modality · section · page · source id</text>
<rect x="560" y="214" width="490" height="250" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="805.0" y="232.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Implementation evidence</text>
<rect x="585" y="254" width="440" height="44" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="805.0" y="279.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">bash · search_corpus — withheld on a normative turn</text>
<rect x="585" y="308" width="440" height="52" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="805.0" y="330.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">what a tool actually RETURNED this turn</text>
<text x="805.0" y="344.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">(not what a file somewhere happens to contain)</text>
<rect x="585" y="370" width="440" height="76" rx="0" ry="0" fill="#f8cecc" stroke="#b85450" stroke-width="1.4"/>
<text x="805.0" y="398.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">grounds EXISTENCE only</text>
<text x="805.0" y="411.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">a name in a comment is still just a name:</text>
<text x="805.0" y="424.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">no modality, no authority, no clause</text>
<rect x="300" y="492" width="480" height="52" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="540.0" y="521.9" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">the answer — every normative claim carries a citation</text>
<rect x="30" y="568" width="1020" height="110" rx="0" ry="0" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
<text x="38.0" y="584.0" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">The guards read the two ledgers separately, and that is the whole point:</text>
<text x="38.0" y="597.2" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">  • a claim may not be stronger than the provision it cites (informative &lt; may &lt; should &lt; shall);</text>
<text x="38.0" y="610.4" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">  • a technical name credited to the document must occur in the document;</text>
<text x="38.0" y="623.6" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">  • a count, a maximum or a minimum needs a clause that states one — counting flags in an implementation does not;</text>
<text x="38.0" y="636.8" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">  • where nothing supports the claim, the answer is withheld with the reason, rather than issued with a guess.</text>
<path d="M540.0,112.0 L540.0,125.0 L540.0,125.0 L540.0,138.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M540.0,188.0 L540.0,221.0 L275.0,221.0 L275.0,254.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="344.6" y="208.0" width="125.8" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="407.5" y="218.0" font-size="10" text-anchor="middle" fill="#444444">authoritative first</text>
<path d="M275.0,298.0 L275.0,303.0 L275.0,303.0 L275.0,308.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M275.0,360.0 L275.0,365.0 L275.0,365.0 L275.0,370.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M540.0,188.0 L540.0,221.0 L805.0,221.0 L805.0,254.0" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="606.5" y="208.0" width="132.0" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="672.5" y="218.0" font-size="10" text-anchor="middle" fill="#444444">implementation scope</text>
<path d="M805.0,298.0 L805.0,303.0 L805.0,303.0 L805.0,308.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M805.0,360.0 L805.0,365.0 L805.0,365.0 L805.0,370.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M275.0,446.0 L275.0,469.0 L540.0,469.0 L540.0,492.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="310.5" y="456.0" width="194.0" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="407.5" y="466.0" font-size="10" text-anchor="middle" fill="#444444">may establish
what is REQUIRED</text>
<path d="M805.0,446.0 L805.0,469.0 L540.0,469.0 L540.0,492.0" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="566.2" y="456.0" width="212.6" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="672.5" y="466.0" font-size="10" text-anchor="middle" fill="#444444">may illustrate
what the code DOES</text>
</svg>