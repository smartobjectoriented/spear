<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 715" width="1100" height="715" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444444"/></marker></defs>
<rect width="1100" height="715" fill="#ffffff"/>
<text x="540.0" y="28.6" font-size="16" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Sandbox  —  wrapper order and confinement</text>
<text x="540.0" y="62.9" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">The order is fixed. prlimit stays INSIDE bubblewrap; the cgroup scope stays OUTSIDE it.</text>
<rect x="40" y="82" width="1000" height="330" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="540.0" y="100.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">systemd transient scope   edgem-tool-&lt;uuid&gt;.scope</text>
<text x="68.0" y="125.5" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">MemoryMax · MemorySwapMax · TasksMax · CPUQuota</text>
<rect x="80" y="140" width="920" height="250" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="540.0" y="158.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">bwrap  (bubblewrap)</text>
<text x="108.0" y="183.5" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">--unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-net</text>
<text x="108.0" y="205.5" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">--clearenv --die-with-parent --new-session</text>
<rect x="120" y="220" width="840" height="152" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="540.0" y="237.0" font-size="11" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">prlimit  --nofile=4096:4096  --core=0:0</text>
<rect x="160" y="262" width="760" height="96" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.4"/>
<text x="540.0" y="280.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">COMMAND   (untrusted argv)</text>
<text x="540.0" y="323.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">PATH=/usr/bin:/bin   HOME=/home/sandbox   TMPDIR=/tmp   cwd=/workspace</text>
<rect x="40" y="440" width="500" height="240" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="290.0" y="458.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Filesystem view</text>
<rect x="60" y="478" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="493.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/usr</text>
<text x="228.0" y="493.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">read-only bind of the host /usr</text>
<rect x="60" y="505" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="520.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/bin /lib /lib64</text>
<text x="228.0" y="520.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">symlinks into /usr (merged-usr)</text>
<rect x="60" y="532" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="547.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/proc</text>
<text x="228.0" y="547.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">fresh procfs for the pid namespace</text>
<rect x="60" y="559" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="574.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/dev</text>
<text x="228.0" y="574.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">minimal device set</text>
<rect x="60" y="586" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="601.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/tmp</text>
<text x="228.0" y="601.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">tmpfs, private</text>
<rect x="60" y="613" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="628.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/home/sandbox</text>
<text x="228.0" y="628.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">empty home</text>
<rect x="60" y="640" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="655.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/etc</text>
<text x="228.0" y="655.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">sealed tmpfs: alternatives only</text>
<rect x="60" y="667" width="150" height="24" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="135.0" y="682.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">/workspace</text>
<text x="228.0" y="682.1" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">the ONLY host-writable mount</text>
<rect x="560" y="440" width="510" height="240" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="815.0" y="458.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Workspace binding follows the profile</text>
<rect x="585" y="480" width="460" height="42" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="815.0" y="504.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">profile.workspace_write   →   --bind  &lt;root&gt;  /workspace</text>
<rect x="585" y="530" width="460" height="42" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="815.0" y="554.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">profile.workspace_read    →   --ro-bind  &lt;root&gt;  /workspace</text>
<rect x="585" y="580" width="460" height="42" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="815.0" y="604.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">neither                             →   --dir  /workspace</text>
<rect x="585" y="630" width="460" height="52" rx="0" ry="0" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
<text x="593.0" y="645.0" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">/etc is a sealed read-only tmpfs holding only /etc/alternatives, so cc and awk resolve;</text>
<text x="593.0" y="656.9" font-size="9" text-anchor="start" xml:space="preserve" fill="#1a1a1a">nothing else from the host /etc is exposed.</text>
</svg>