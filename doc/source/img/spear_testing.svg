<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 709" width="1100" height="709" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444444"/></marker></defs>
<rect width="1100" height="709" fill="#ffffff"/>
<text x="540.0" y="28.6" font-size="16" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Test topology</text>
<rect x="40" y="55" width="1000" height="180" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="540.0" y="73.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Always on  —  no external prerequisite</text>
<rect x="70" y="95" width="460" height="55" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="300.0" y="119.4" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">tests/  —  44 modules, 851 tests</text>
<text x="300.0" y="132.6" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">runtime · context · sessions · training · tools</text>
<rect x="560" y="95" width="450" height="55" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="785.0" y="119.4" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">tests/test_tool_runtime.py  —  307 of them</text>
<text x="785.0" y="132.6" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">policy · workspace · sandbox · cgroup · audit</text>
<rect x="70" y="165" width="940" height="55" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="540.0" y="196.0" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">PinnedNamespaceAttachmentTests  —  helper argv, pass_fds, FD hygiene, namespace type checks, fail-closed paths</text>
<rect x="40" y="255" width="1000" height="300" rx="8" ry="8" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="540.0" y="273.0" font-size="12" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">Opt-in  —  guarded by an environment flag</text>
<rect x="70" y="300" width="330" height="62" rx="0" ry="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="235.0" y="334.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">SPEAR_TEST_NETWORK=1</text>
<rect x="420" y="300" width="400" height="62" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="620.0" y="334.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">outbound DNS and TLS through slirp4netns</text>
<rect x="840" y="300" width="170" height="62" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="925.0" y="334.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">needs Internet</text>
<rect x="70" y="380" width="330" height="62" rx="0" ry="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="235.0" y="414.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">SPEAR_TEST_CGROUP=1</text>
<rect x="420" y="380" width="400" height="62" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="620.0" y="414.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">real transient scopes: memory, pids, cpu, timeout, membership</text>
<rect x="840" y="380" width="170" height="62" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="925.0" y="408.2" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">needs a systemd user bus with</text>
<text x="925.0" y="420.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">delegation</text>
<rect x="70" y="460" width="330" height="62" rx="0" ry="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="235.0" y="494.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">SPEAR_TEST_NETWORK_RACE=1</text>
<rect x="420" y="460" width="400" height="62" rx="0" ry="0" fill="#ffffff" stroke="#666666" stroke-width="1.4"/>
<text x="620.0" y="494.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">40x repetitions with a deliberate 20/50 ms delay, plus CPU load</text>
<rect x="840" y="460" width="170" height="62" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="925.0" y="494.1" font-size="9" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">long running</text>
<rect x="40" y="575" width="1000" height="110" rx="0" ry="0" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
<text x="48.0" y="591.0" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">Residual-state checks belong to the suites themselves: after every run there must be zero edgem-tool-*.scope unit, zero orphan bwrap or slirp4netns process, and no descriptor</text>
<text x="48.0" y="604.2" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">growth in the supervisor. The characterization test test_characterization_old_pid_based_attachment_still_races deliberately asserts that the OLD attachment still fails — if a</text>
<text x="48.0" y="617.4" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">future slirp4netns or kernel makes it safe, that test turns red and tells us the workaround can be revisited.</text>
</svg>