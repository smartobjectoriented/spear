<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" width="1100" height="630" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444444"/></marker></defs>
<rect width="1100" height="630" fill="#ffffff"/>
<text x="540.0" y="28.6" font-size="16" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">The engineering workflow</text>
<text x="540.0" y="46.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">Each stage opens only on a condition the runtime can check. A stage that cannot open says so; it does not proceed on an assumption.</text>
<rect x="30" y="96" width="186" height="92" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="123.0" y="119.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">INVESTIGATE</text>
<text x="123.0" y="132.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold"></text>
<text x="123.0" y="145.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">read the authoritative</text>
<text x="123.0" y="158.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">source and the</text>
<text x="123.0" y="171.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">implementation</text>
<rect x="242" y="96" width="186" height="92" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="335.0" y="119.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">PLAN</text>
<text x="335.0" y="132.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold"></text>
<text x="335.0" y="145.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">one recorded item per</text>
<text x="335.0" y="158.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">requirement, each with</text>
<text x="335.0" y="171.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">its validation</text>
<rect x="454" y="96" width="186" height="92" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="547.0" y="125.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">EDIT</text>
<text x="547.0" y="138.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold"></text>
<text x="547.0" y="152.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">write only the files a</text>
<text x="547.0" y="165.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">planned item named</text>
<rect x="666" y="96" width="186" height="92" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="759.0" y="119.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">TEST</text>
<text x="759.0" y="132.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold"></text>
<text x="759.0" y="145.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">run the validation that</text>
<text x="759.0" y="158.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">reaches the changed</text>
<text x="759.0" y="171.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">behaviour</text>
<rect x="878" y="96" width="186" height="92" rx="0" ry="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<text x="971.0" y="125.7" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">REVIEW</text>
<text x="971.0" y="138.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold"></text>
<text x="971.0" y="152.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">report per requirement</text>
<text x="971.0" y="165.3" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a" font-weight="bold">from the ledger</text>
<rect x="242" y="236" width="398" height="62" rx="0" ry="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.4"/>
<text x="441.0" y="270.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">write gate — a file is writable only because a planned item named it</text>
<rect x="30" y="330" width="1020" height="62" rx="0" ry="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="540.0" y="357.9" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">requirement ledger — one row per requirement: its evidence, its disposition, its validation.</text>
<text x="540.0" y="371.1" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">The closing report is read from this, not from the answer&#x27;s prose.</text>
<rect x="30" y="420" width="1020" height="56" rx="0" ry="0" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
<text x="540.0" y="451.5" font-size="10" text-anchor="middle" xml:space="preserve" fill="#1a1a1a">replan — a validation that keeps failing the same way reopens PLAN rather than being patched again</text>
<rect x="30" y="496" width="1020" height="110" rx="0" ry="0" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
<text x="38.0" y="512.0" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">Why the stages are separate rather than one pass:</text>
<text x="38.0" y="525.2" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">  • a requirement nobody read cannot be planned against, so INVESTIGATE holds both the authoritative and the implementation side before PLAN opens;</text>
<text x="38.0" y="538.4" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">  • deciding how a behaviour will be proved BEFORE writing it is what makes TEST a check rather than a description, so a plan item carries its validation;</text>
<text x="38.0" y="551.6" font-size="10" text-anchor="start" xml:space="preserve" fill="#1a1a1a">  • the ledger, not the closing prose, decides whether the turn is finished — which is how ‘incomplete’ and ‘out of scope’ survive to the report.</text>
<path d="M216.0,142.0 L229.0,142.0 L229.0,142.0 L242.0,142.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="134.8" y="129.0" width="175.4" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="222.5" y="139.0" font-size="10" text-anchor="middle" fill="#444444">both kinds of
evidence held</text>
<path d="M428.0,142.0 L441.0,142.0 L441.0,142.0 L454.0,142.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="390.2" y="129.0" width="88.6" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="434.5" y="139.0" font-size="10" text-anchor="middle" fill="#444444">item accepted</text>
<path d="M640.0,142.0 L653.0,142.0 L653.0,142.0 L666.0,142.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="605.3" y="129.0" width="82.4" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="646.5" y="139.0" font-size="10" text-anchor="middle" fill="#444444">file written</text>
<path d="M852.0,142.0 L865.0,142.0 L865.0,142.0 L878.0,142.0" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="808.0" y="129.0" width="101.0" height="14" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
<text x="858.5" y="139.0" font-size="10" text-anchor="middle" fill="#444444">result recorded</text>
<path d="M335.0,188.0 L335.0,212.0 L441.0,212.0 L441.0,236.0" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<path d="M441.0,236.0 L441.0,212.0 L547.0,212.0 L547.0,188.0" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<path d="M123.0,188.0 L123.0,259.0 L540.0,259.0 L540.0,330.0" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<path d="M971.0,188.0 L971.0,259.0 L540.0,259.0 L540.0,330.0" fill="none" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
</svg>